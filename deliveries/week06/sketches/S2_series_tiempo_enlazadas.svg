="normal" text-anchor="start">y a su vez filtra el mapa (serie anidada)</text><path d="M874 515 Q872.0 480 870.0 450" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ar)"/><rect x="24" y="658" width="1152" height="108" rx="6" fill="#f4efe1" stroke="#b8a77a" stroke-width="1.2"/><text x="38" y="678" font-size="13.5" fill="#2b3442" font-weight="bold" text-anchor="start">Pregunta</text><text x="168" y="678" font-size="13.5" fill="#2b3442" font-weight="normal" text-anchor="start">¿En qué meses y a qué horas hay captura? ¿Cambia el patrón entre periodos?</text><text x="38" y="698" font-size="13.5" fill="#2b3442" font-weight="bold" text-anchor="start">Codificación</text><text x="168" y="698" font-size="13.5" fill="#2b3442" font-weight="normal" text-anchor="start">barras: posición x = tiempo · altura = nº de registros · azul = dentro de la selección</text><text x="38" y="718" font-size="13.5" fill="#2b3442" font-weight="bold" text-anchor="start">Interacción</text><text x="168" y="718" font-size="13.5" fill="#2b3442" font-weight="normal" text-anchor="start">selección por arrastre con bordes ajustables · teclado (flechas, Mayús, Esc) · enlazado con el mapa</text><text x="38" y="738" font-size="13.5" fill="#2b3442" font-weight="bold" text-anchor="start">Por qué</text><text x="168" y="738" font-size="13.5" fill="#2b3442" font-weight="normal" text-anchor="start">una serie con selección sustituye a los selectores por año (redundantes) y permite elegir p. ej. mediados de 2020 a 2022</text></svg>