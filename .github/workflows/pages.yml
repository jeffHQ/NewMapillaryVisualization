# Publica la aplicación final (deliveries/week15/app) en GitHub Pages en cada push a main.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["deliveries/week15/app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionar recursos (evita que el navegador use CSS/JS en caché obsoletos)
        run: sed -i "s/__VER__/${GITHUB_SHA::7}/g" deliveries/week15/app/index.html deliveries/week15/app/project.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deliveries/week15/app
      - id: deployment
        uses: actions/deploy-pages@v4
