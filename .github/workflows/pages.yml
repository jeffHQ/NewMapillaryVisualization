# Publica la aplicación de la entrega vigente en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["deliveries/week12/app/**", "deliveries/week12/paper/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensamblar sitio
        run: |
          mkdir site
          cp -r deliveries/week12/app/. site/
          mkdir -p site/paper && cp deliveries/week12/paper/PaperDraft.pdf site/paper/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
