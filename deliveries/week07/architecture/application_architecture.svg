<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="'Segoe Print','Comic Sans MS',cursive"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs><rect width="1200" height="780" fill="#fdfcf8"/><text x="24" y="38" font-size="24" fill="#2b3442" font-weight="bold" text-anchor="start">Arquitectura de la aplicación</text><text x="24" y="62" font-size="15" fill="#5b6675" font-weight="normal" text-anchor="start">De la API de Mapillary al navegador: datos, estado compartido, vistas y despliegue</text><text x="30" y="100" font-size="14" fill="#5b6675" font-weight="bold" text-anchor="start">1 · Pipeline de datos (Python, offline) — deliveries/week12/code</text><rect x="30" y="112" width="200" height="112" rx="8" fill="#f4f8ff" stroke="#2b3442" stroke-width="1.8"/><text x="42" y="136" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Mapillary API v4</text><text x="42" y="158" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">map_features · images</text><text x="42" y="176" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">cuadrícula 0,005°</text><text x="42" y="194" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">01 · 02</text><rect x="290" y="112" width="200" height="112" rx="8" fill="#f4f8ff" stroke="#2b3442" stroke-width="1.8"/><text x="302" y="136" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Limpieza</text><text x="302" y="158" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">GeoJSON limpio</text><text x="302" y="176" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">fechas en hora de Praga</text><text x="302" y="194" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">03</text><rect x="550" y="112" width="210" height="112" rx="8" fill="#f4f8ff" stroke="#2b3442" stroke-width="1.8"/><text x="562" y="136" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Trayectorias</text><text x="562" y="158" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">encadenar ≤15 s / ≤60 m</text><text x="562" y="176" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">ajuste a la red (OSRM)</text><text x="562" y="194" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">04</text><rect x="820" y="112" width="230" height="112" rx="8" fill="#f4f8ff" stroke="#2b3442" stroke-width="1.8"/><text x="832" y="136" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Datos procesados</text><text x="832" y="158" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">CSV (análisis) + JSON (app)</text><text x="832" y="176" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">categorías, muestras 40 m</text><text x="832" y="194" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">05</text><path d="M232 168 L288 168" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/><path d="M492 168 L548 168" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/><path d="M762 168 L818 168" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/><path d="M935 226 L935 280" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/><text x="945" y="258" font-size="12" fill="#c2410c" font-weight="normal" text-anchor="start">app/data/*.json (~3,3 MB)</text><text x="30" y="292" font-size="14" fill="#5b6675" font-weight="bold" text-anchor="start">2 · Aplicación estática (HTML + CSS + JS, sin build) — deliveries/week12/app</text><rect x="30" y="304" width="270" height="200" rx="8" fill="#fff8ec" stroke="#b7791f" stroke-width="1.8"/><text x="42" y="328" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Estado compartido (state)</text><text x="42" y="350" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">capa activa</text><text x="42" y="368" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">rango de meses · rango de horas</text><text x="42" y="386" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">categorías · modos · resto en gris</text><text x="42" y="404" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">reloj (día 24 h / relativo)</text><rect x="340" y="304" width="250" height="200" rx="8" fill="#fff8ec" stroke="#b7791f" stroke-width="1.8"/><text x="352" y="328" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Filtrado (crossfilter)</text><text x="352" y="350" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">objetos: mes · hora · categoría</text><text x="352" y="368" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">trayectorias: mes · hora · modo</text><text x="352" y="386" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">cada serie ignora su propio</text><text x="352" y="404" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">filtro (qué se pierde)</text><rect x="630" y="304" width="250" height="200" rx="8" fill="#f1faf4" stroke="#2f855a" stroke-width="1.8"/><text x="642" y="328" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Vistas</text><text x="642" y="350" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">mapa deck.gl: puntos,</text><text x="642" y="368" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">hexágonos 3D, TripsLayer</text><text x="642" y="386" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">series de tiempo (SVG)</text><text x="642" y="404" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">leyenda-filtro · ranking · reloj</text><rect x="920" y="304" width="250" height="200" rx="8" fill="#f1faf4" stroke="#2f855a" stroke-width="1.8"/><text x="932" y="328" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Narrativa</text><text x="932" y="350" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">recorrido guiado (6 pasos)</text><text x="932" y="368" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">cada paso fija capa, filtros</text><text x="932" y="386" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">y cámara, con cifras</text><text x="932" y="404" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">calculadas de los datos</text><path d="M300 404 L338 404" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/><path d="M590 404 L628 404" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/><path d="M920 404 L882 404" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/><text x="1015" y="528" font-size="12" fill="#c2410c" font-weight="normal" text-anchor="start">vista ⟷ estado</text><path d="M755 506 Q755 540 165 540 Q165 520 165 506" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="400" y="556" font-size="12" fill="#c2410c" font-weight="normal" text-anchor="start">interacciones (arrastrar, casillas, reloj) actualizan el estado → se vuelve a filtrar y a dibujar</text><text x="30" y="592" font-size="14" fill="#5b6675" font-weight="bold" text-anchor="start">3 · Plataforma</text><rect x="30" y="604" width="260" height="92" rx="8" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.8"/><text x="42" y="628" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Navegador</text><text x="42" y="650" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">WebGL (deck.gl 8.9)</text><text x="42" y="668" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">MapLibre GL 3.6</text><rect x="340" y="604" width="260" height="92" rx="8" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.8"/><text x="352" y="628" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Mapa base (CDN)</text><text x="352" y="650" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">CARTO Positron</text><text x="352" y="668" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">© OpenStreetMap</text><rect x="650" y="604" width="260" height="92" rx="8" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.8"/><text x="662" y="628" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Publicación</text><text x="662" y="650" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">GitHub Pages (Actions)</text><text x="662" y="668" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">.github/workflows/pages.yml</text><rect x="960" y="604" width="210" height="92" rx="8" fill="#fdf2f8" stroke="#9d174d" stroke-width="1.8"/><text x="972" y="628" font-size="14.5" fill="#2b3442" font-weight="bold" text-anchor="start">Tecnología</text><text x="972" y="650" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">deck.gl (decisión del</text><text x="972" y="668" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">equipo); D3 = contingencia</text></svg>