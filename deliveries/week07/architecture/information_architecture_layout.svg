<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="'Segoe Print','Comic Sans MS',cursive"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs><rect width="1200" height="780" fill="#fdfcf8"/><text x="24" y="38" font-size="24" fill="#2b3442" font-weight="bold" text-anchor="start">Arquitectura de la información y layout</text><text x="24" y="62" font-size="15" fill="#5b6675" font-weight="normal" text-anchor="start">Una sola pantalla: el mapa como lienzo, un panel lateral con narrativa, filtros y detalle</text><rect x="30" y="80" width="1140" height="52" rx="6" fill="#ffffff" stroke="#2b3442" stroke-width="1.8"/><text x="46" y="112" font-size="14" fill="#2b3442" font-weight="bold" text-anchor="start">CABECERA — título · pregunta guía · enlace a la página del proyecto</text><rect x="30" y="142" width="760" height="520" rx="6" fill="#ffffff" stroke="#2b3442" stroke-width="1.8"/><text x="46" y="168" font-size="14" fill="#2b3442" font-weight="bold" text-anchor="start">MAPA (deck.gl + MapLibre) — lienzo principal</text><rect x="46" y="180" width="420" height="32" rx="16" fill="#eef4ff" stroke="#0b5fb8" stroke-width="1.5"/><text x="58" y="202" font-size="11.5" fill="#2b3442" font-weight="normal" text-anchor="start">① Selector de capa: Objetos · Densidad 3D · Trayectorias</text><rect x="46" y="460" width="260" height="190" rx="8" fill="#eef4ff" stroke="#0b5fb8" stroke-width="1.5"/><text x="58" y="482" font-size="12.5" fill="#2b3442" font-weight="bold" text-anchor="start">② Leyenda = filtro</text><text x="58" y="502" font-size="11.5" fill="#2b3442" font-weight="normal" text-anchor="start">casillas · «solo» · 3 mayores</text><text x="58" y="520" font-size="11.5" fill="#2b3442" font-weight="normal" text-anchor="start">resto en gris · modos (según capa)</text><rect x="560" y="180" width="220" height="150" rx="8" fill="#eef4ff" stroke="#0b5fb8" stroke-width="1.5"/><text x="572" y="202" font-size="12.5" fill="#2b3442" font-weight="bold" text-anchor="start">③ Reloj de 24 h</text><text x="572" y="222" font-size="11.5" fill="#2b3442" font-weight="normal" text-anchor="start">solo en Trayectorias:</text><text x="572" y="240" font-size="11.5" fill="#2b3442" font-weight="normal" text-anchor="start">HH:MM · deslizador</text><text x="572" y="258" font-size="11.5" fill="#2b3442" font-weight="normal" text-anchor="start">play · velocidad · activas</text><rect x="330" y="340" width="200" height="60" rx="8" fill="#fff8ec" stroke="#b7791f" stroke-width="1.5"/><text x="340" y="362" font-size="12.5" fill="#2b3442" font-weight="bold" text-anchor="start">④ Tooltip (hover)</text><text x="340" y="382" font-size="11.5" fill="#2b3442" font-weight="normal" text-anchor="start">detalle bajo demanda</text><rect x="810" y="142" width="360" height="520" rx="6" fill="#f6f8fb" stroke="#2b3442" stroke-width="1.8"/><text x="826" y="168" font-size="14" fill="#2b3442" font-weight="bold" text-anchor="start">PANEL LATERAL</text><rect x="826" y="182" width="328" height="66" rx="8" fill="#eef4ff" stroke="#0b5fb8" stroke-width="1.5"/><text x="838" y="206" font-size="12.5" fill="#2b3442" font-weight="bold" text-anchor="start">⑤ Recorrido guiado (1/6)</text><text x="838" y="228" font-size="11.5" fill="#3d4857" font-weight="normal" text-anchor="start">pregunta · hallazgo · anterior/siguiente</text><rect x="826" y="258" width="328" height="112" rx="8" fill="#eef4ff" stroke="#0b5fb8" stroke-width="1.5"/><text x="838" y="282" font-size="12.5" fill="#2b3442" font-weight="bold" text-anchor="start">⑥ Series de tiempo enlazadas</text><text x="838" y="304" font-size="11.5" fill="#3d4857" font-weight="normal" text-anchor="start">mes (selección por arrastre) → hora</text><rect x="826" y="380" width="328" height="70" rx="8" fill="#fff8ec" stroke="#b7791f" stroke-width="1.5"/><text x="838" y="404" font-size="12.5" fill="#2b3442" font-weight="bold" text-anchor="start">⑦ Elementos más frecuentes</text><text x="838" y="426" font-size="11.5" fill="#3d4857" font-weight="normal" text-anchor="start">ranking recalculado con los filtros</text><rect x="826" y="460" width="328" height="70" rx="8" fill="#f1faf4" stroke="#2f855a" stroke-width="1.5"/><text x="838" y="484" font-size="12.5" fill="#2b3442" font-weight="bold" text-anchor="start">⑧ Datos y límites</text><text x="838" y="506" font-size="11.5" fill="#3d4857" font-weight="normal" text-anchor="start">fuente, licencia, advertencias</text><text x="826" y="554" font-size="12" fill="#c2410c" font-weight="normal" text-anchor="start">Orden de lectura: ⑤ → ① → ② → ⑥ → ⑦ → ⑧</text><text x="40" y="696" font-size="12.5" fill="#c2410c" font-weight="normal" text-anchor="start">El recorrido guiado ⑤ cambia capa, filtros y cámara de ① ② ③ ⑥ en cada paso; ⑥ filtra el mapa y ⑦ se recalcula.</text><text x="40" y="716" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">Responsive: por debajo de 900 px el panel pasa debajo del mapa (una columna).</text><text x="40" y="738" font-size="12.5" fill="#3d4857" font-weight="normal" text-anchor="start">Accesibilidad: teclado en series y recorrido · contraste alto · movimiento reducido pausa la animación · paletas seguras para daltonismo.</text></svg>